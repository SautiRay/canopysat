<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-YN97S75KQF"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-YN97S75KQF');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CanopySat Forest Guardian — Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0D3B2E; color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .card { background: #1B4332; border-radius: 12px; padding: 35px; width: 100%; max-width: 400px; border: 1px solid #1B6B45; margin: 20px; }
        .logo { text-align: center; margin-bottom: 25px; }
        .logo-emoji { font-size: 40px; }
        .logo h1 { font-size: 18px; letter-spacing: 2px; color: white; margin-top: 8px; }
        .logo p { font-size: 10px; color: #3DAA6B; letter-spacing: 1px; }
        h2 { font-size: 20px; color: #3DAA6B; margin-bottom: 20px; text-align: center; }
        label { font-size: 11px; color: #3DAA6B; display: block; margin-bottom: 4px; }
        input { width: 100%; padding: 10px 12px; background: #0D3B2E; border: 1px solid #1B6B45; border-radius: 6px; color: white; font-size: 13px; margin-bottom: 14px; }
        input:focus { outline: none; border-color: #3DAA6B; }
        .btn { width: 100%; padding: 12px; background: #2D8A5A; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; letter-spacing: 1px; }
        .btn:hover { background: #3DAA6B; }
        .msg { padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 12px; display: none; }
        .msg-err { background: #3B1B1B; color: #E53935; border: 1px solid #E53935; }
        .link { text-align: center; margin-top: 15px; font-size: 12px; color: #D6EFE1; }
        .link a { color: #3DAA6B; text-decoration: none; }
        .divider { text-align: center; color: #2D6A4F; font-size: 11px; margin: 15px 0; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <div class="logo-emoji">🛡️</div>
        <h1>CANOPYSAT</h1>
        <p>FOREST GUARDIAN</p>
    </div>
    <h2>Sign In</h2>
    <div class="msg msg-err" id="msg"></div>
    <label>Email</label>
    <input type="email" id="email" placeholder="your@email.com">
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••">
    <button class="btn" onclick="login()">🌿 Sign In</button>
    <div class="divider">— or —</div>
    <div class="link">No account? <a href="/guardian/register">Create one free →</a></div>
    <div class="link" style="margin-top:8px;"><a href="/guardian/forgot">Forgot password?</a></div>
    <div class="link" style="margin-top:8px;"><a href="/">← Back to CanopySat</a></div>
</div>
<script>
async function login() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    if (!email || !password) { showErr('Please fill all fields'); return; }
    const res = await fetch('/guardian/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email, password})
    });
    const data = await res.json();
    if (data.success) {
        window.location.href = data.redirect;
    } else {
        showErr(data.error || 'Login failed');
    }
}
function showErr(msg) {
    const el = document.getElementById('msg');
    el.textContent = msg;
    el.style.display = 'block';
}
document.addEventListener('keypress', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
